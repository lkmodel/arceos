[package]
name = "arceos-loader_lib"
version = "0.1.0"
authors = ["Marina Zhang <inchinaxiaofeng@gmail.com>"]
edition.workspace = true

[features]
default = ["fs", "driver-ramdisk", "batch"]

# 一级可选项目

# 单进程模式
unikernel = ["placeholder"]
# 单进程，但是批处理模式
batch = ["placeholder"]
# `WIP` 不要使用，正在开发！
# 无特权级的多进程模式
pseudo_multi_process = ["axruntime/multitask", "axruntime/paging", "axhal/pseudo_multi_process", "signal"]

## 二级可选项目（不应该直接选择，可以包含三级）
fs = ["alloc", "paging", "axruntime/fs", "axdriver/virtio-blk"]
paging = ["alloc", "axhal/paging"]
placeholder = ["placeholder_signal"]

### 三级可选特性（只能包含依赖，不应该包含其他特性）

signal = []
placeholder_signal = []
alloc = ["axalloc", "axruntime/alloc"]
driver-ramdisk = ["axdriver?/ramdisk", "axfs/use-ramdisk"]

[dependencies]
# `ArceOS` modules
axstd = { workspace = true, features = ["alloc"] }
axlog = { workspace = true }
axhal = { workspace = true }
axtask = { workspace = true }
axsync = { workspace = true, features = ["multitask"] }
axfs = { workspace = true, features = ["default"] }
arceos_posix_api = { workspace = true, features = ["multitask", "alloc"] }
axruntime = { workspace = true }
axmm = { workspace = true }
axdriver = { workspace = true, optional = true }
axalloc = { workspace = true , optional = true }

# Other crates
kernel-elf-parser = "0.1"
kspin = "0.1"
axfs_vfs = "0.1"
elf = { version = "0.7.4", default-features = false }
axio = { version = "0.1", features = ["alloc"] }
cty = "0.2.2"
axerrno = "0.1.0"
numeric-enum-macro = "0.2.0"
bitflags = "2.0"
lazyinit = "0.2"
memory_addr = "0.3"
rand = { version = "0.8.5" , default-features = false, features = [
    "small_rng",
]}
# compiler_builtins的cc特性打开的时候，得注意下会不会编译报错说浮点类型不一致
compiler_builtins = "0.1.152"
