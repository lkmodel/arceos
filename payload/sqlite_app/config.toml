[dev]
rename = "sqlite3"
ttype = "dynamic"
#dynamic_flags = ["shell.c", "-lpthread", "-ldl", "-lm"] #See https://www.sqlite.org/howtocompile.html
#dynamic_flags = ["shell.c", "-DSQLITE_THREADSAFE=0", "-ldl", "-lm"] #non-threadsafe mode
#dynamic_flags = ["shell.c", "-DSQLITE_THREADSAFE=0", "-DSQLITE_OMIT_LOAD_EXTENSION"] #no dynamic loading
dynamic_flags = ["main.c", "-DSQLITE_THREADSAFE=0", "-DSQLITE_OMIT_FLOATING_POINT", "-DSQLITE_OMIT_LOAD_EXTENSION", "-DSQLITE_DEBUG", "-Isqlite3_src","-g"] #https://github.com/arceos-org/arceos-apps/blob/main/c/sqlite3/axbuild.mk
#dynamic_flags = ["test/speedtest1.c", "-DSQLITE_ENABLE_MEMSYS5","-DSQLITE_ENABLE_RTREE","-DSQLITE_THREADSAFE=0", "-DSQLITE_OMIT_LOAD_EXTENSION", "-DSQLITE_DEBUG", "-Isqlite3_src","-g","-Os"]
snapshot = false