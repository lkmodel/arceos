name: Diff SQLite3

on:
  push:
    branches: [mocklibc]
  pull_request:
    branches: [mocklibc]

env:
  qemu-version: 8.2.0
  rust-toolchain: nightly-2024-12-25
  CI: 1
  SQLITEVERSION: 3490100

jobs:
  loader-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        arch: [riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust-toolchain }}
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-binutils
      - uses: ./.github/workflows/actions/setup-qemu
        with:
          qemu-version: ${{ env.qemu-version }}
      - uses: ./.github/workflows/actions/setup-musl
        with:
          arch: ${{ matrix.arch }}
      - uses: taiki-e/install-action@just
      - name: Run SQLite sppedtest in Linux
        run: just payload/sqlite_app/
      #      - name: run all apps
#        run: cargo xtask all
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: speedtest-output
          path: payload/sqlite_app/speedtest